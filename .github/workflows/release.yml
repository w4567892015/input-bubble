name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches metadata.json version
        run: |
          version=$(jq -r .version metadata.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match metadata.json version ${version} (expected v${version})"
            exit 1
          fi

      - name: Build zip
        run: |
          zip input-bubble@w4567892015.shell-extension.zip \
            metadata.json extension.js stylesheet.css LICENSE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            input-bubble@w4567892015.shell-extension.zip \
            --title "Input Bubble ${GITHUB_REF_NAME}" \
            --generate-notes
